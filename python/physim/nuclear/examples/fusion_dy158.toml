schema = "physim.experiment/1"
title = "Fusion-evaporation: 158Dy from 12C on 150Nd"
description = "The 150Nd(12C,4n)158Dy reaction at 60 MeV, a standard way to make the yrast band of 158Dy: the compound nucleus 162Dy is made at 50 MeV of excitation and boils off mostly four neutrons. Five germanium detectors see the residues' gamma rays; a small silicon detector at 30 degrees counts the elastically scattered beam as a monitor. The channel cross sections are illustrative values of the size PACE4 gives for this system, not a measurement: replace them with your own PACE4 run or measured values. The yrast bands of 158Dy and 156Gd are from ENSDF."

[reaction]
type = "fusion-evaporation"
alignment = 0.3
side_feeding = "25 %"

[[reaction.channels]]
residue = "159Dy"
particles = "3n"
cross_section = "10 mb"
source = "illustrative"

[[reaction.channels]]
residue = "158Dy"
particles = "4n"
cross_section = "520 mb"
source = "illustrative"

[[reaction.channels]]
residue = "157Dy"
particles = "5n"
cross_section = "110 mb"
source = "illustrative"

[[reaction.channels]]
residue = "158Tb"
particles = "p3n"
cross_section = "25 mb"
source = "illustrative"

[[reaction.channels]]
residue = "156Gd"
particles = "a2n"
cross_section = "35 mb"
source = "illustrative"

[beam]
nuclide = "12C"
energy = "60 MeV"
current = "5 pnA"
energy_spread = "0.1 %"
spot_size = "1 mm"

[target]
material = "150Nd"
thickness = "1 mg/cm2"

[run]
beam_time = "48 h"
counts_wanted = 10000

[[detectors]]
name = "Monitor"
shape = "circle"
theta = "30 deg"
phi = "0 deg"
distance = "200 mm"
radius = "1 mm"
thickness = "300 um"
dead_layer = "0.5 um"
resolution = "50 keV"
threshold = "1 MeV"

[[gamma_detectors]]
name = "Ge90"
theta = "90 deg"
phi = "0 deg"
distance = "200 mm"
radius = "35 mm"
resolution = "2.2 keV"

[[gamma_detectors]]
name = "Ge37"
theta = "37 deg"
phi = "90 deg"
distance = "200 mm"
radius = "35 mm"
resolution = "2.2 keV"

[[gamma_detectors]]
name = "Ge79"
theta = "79 deg"
phi = "180 deg"
distance = "200 mm"
radius = "35 mm"
resolution = "2.2 keV"

[[gamma_detectors]]
name = "Ge101"
theta = "101 deg"
phi = "-90 deg"
distance = "200 mm"
radius = "35 mm"
resolution = "2.2 keV"

[[gamma_detectors]]
name = "Ge143"
theta = "143 deg"
phi = "45 deg"
distance = "200 mm"
radius = "35 mm"
resolution = "2.2 keV"

