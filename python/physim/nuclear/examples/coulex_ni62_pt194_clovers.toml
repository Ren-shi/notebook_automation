schema = "physim.experiment/1"
title = "Coulomb excitation of 62Ni on 194Pt, with four clovers"
description = "Coulomb excitation of a 62Ni beam (charge state 6+, 237 MeV) on 194Pt, seen at backward angles: an annular silicon detector 30 mm behind the target catches the backscattered beam (the beam comes in through its hole), two strip detectors stand at 110 deg, behind 90 deg and so clear of the forward-scattered beam and of the target recoils, and four germanium clovers (four crystals each, with add-back and BGO Compton-suppression shields) see the gamma rays from above and below the beam, two at 45 deg and two at 135 deg. The reaction excites the projectile's first 2+ state (1172.91 keV). The level schemes of 62Ni (with its 4+ state at 2336 keV) and of 194Pt (2+ at 328 keV) are from ENSDF: the first feeds the cascades and the multi-step solution, the second is there to study the target's excitation."

[reaction]
type = "coulex"
excite = "projectile"
energy = "1172.91 keV"
multipolarity = "E2"
b_up = "884.105 e2fm4"

[beam]
nuclide = "62Ni"
energy = "237 MeV"
current = "1 pnA"
charge_state = 6

[target]
material = "194Pt"
thickness = "0.5 mg/cm2"

[run]
beam_time = "24 h"
counts_wanted = 500

