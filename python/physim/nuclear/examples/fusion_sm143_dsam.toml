schema = "physim.experiment/1"
title = "Doppler-shift attenuation after fusion-evaporation: 143Sm"
description = "The Doppler-shift attenuation (DSAM) measurement of S. Rajbanshi et al., Phys. Lett. B 782, 143 (2018), at IUAC with INGA: 124Sn(24Mg,5n)143Sm at 107 MeV on a 0.8 mg/cm2 124Sn target (enriched to 99.9 %) on a 13 mg/cm2 gold backing, in which the residues (beta about 1.6 %) slow down and stop. Eighteen clovers with BGO shields: six at 90 deg, four at 123 deg, four at 148 deg and four at 57 deg; the line shapes were fitted at 148, 123 and 90 deg. The level scheme is the paper's: the dipole bands DB I (45/2- to 53/2-, on the 43/2- level at 8614 keV) and DB II (51/2- to 57/2(-)) with their mean lives, mixing ratios and branchings from Table I; the two top levels have only upper limits there (0.78 and 0.66 ps), entered as values. The paper's side-feeding times (0.08 to 0.21 ps, Table I) cannot be written in a setup (physim's side feeding is a rotational band with one quadrupole moment), so the validation's reproduction (physim.nuclear.lifetime_reproduction.sm143) takes them from tests/reference/nuclear/lifetimes/published/setups.toml. The channel cross sections, the entry spin of the 5n channel (57/2, the top of DB II), beam current, detector distances and beam time are illustrative, not from the paper. A small silicon detector at 30 deg counts the elastically scattered beam as a monitor, as in the other fusion examples (not in the paper)."

