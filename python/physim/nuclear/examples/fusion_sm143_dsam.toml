type = "fusion-evaporation"

[[reaction.channels]]
residue = "144Sm"
particles = "4n"
cross_section = "250 mb"
source = "illustrative"

[[reaction.channels]]
residue = "143Sm"
particles = "5n"
cross_section = "450 mb"
entry_spin = 28.5
source = "illustrative"

[[reaction.channels]]
residue = "142Sm"
particles = "6n"
cross_section = "80 mb"
source = "illustrative"

