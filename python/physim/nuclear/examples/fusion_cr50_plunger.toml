schema = "physim.experiment/1"
title = "Three-foil plunger after fusion-evaporation: 50Cr"
description = "The differential (three-foil) plunger measurement of C. Beckers et al., Nucl. Instrum. Methods A 1042, 167418 (2022), commissioning the CoCoDiff plunger at Cologne: 24Mg(32S,4p2n)50Cr at 100 MeV on a self-supporting 0.6 mg/cm2 24Mg target. The residues fly across a gap to a 4.4 mg/cm2 tantalum degrader (beta about 3.9 % before it, 1.5 % after), then across a second gap to a 6.5 mg/cm2 tantalum foil that stops them. Eleven germanium detectors: five at 142.3 deg and six at 45 deg. The paper used nine pairs of distances, 17 to 750 um to the degrader and 40 to 335 um between the foils; the setup keeps one gap between the foils (100 um here), and the distances other than 17, 42, 62, 122 and 750 um are illustrative. The level scheme of 50Cr is the yrast band to 6+, with the paper's mean lives of the 2+ (12.2 ps) and 4+ (2.4 ps) and ENSDF's for the 6+ (the paper does not give it). The validation's reproduction (physim.nuclear.lifetime_reproduction.cr50) varies the second gap with the first, as the paper did. The channel cross sections, beam current, detector distances and beam time are illustrative too, not from the paper: replace the channels with your own PACE4 run. A small silicon detector at 30 deg counts the elastically scattered beam as a monitor, as in the other fusion examples (not in the paper)."

[reaction]
type = "fusion-evaporation"

[[reaction.channels]]
residue = "52Mn"
particles = "3pn"
cross_section = "150 mb"
source = "illustrative"

[[reaction.channels]]
residue = "49V"
particles = "a3p"
cross_section = "120 mb"
source = "illustrative"

[[reaction.channels]]
residue = "48Cr"
particles = "2a"
cross_section = "60 mb"
source = "illustrative"

[[reaction.channels]]
residue = "50Cr"
particles = "4p2n"
cross_section = "40 mb"
source = "illustrative"

[beam]
nuclide = "32S"
energy = "100 MeV"
current = "5 pnA"

[target]
material = "24Mg"
thickness = "0.6 mg/cm2"

[run]
