# Organic scintillators for neutron detection, read by physim.nuclear.neutrons.
#
# Each [materials.X] table has:
#   title            what it is
#   kind             "liquid" or "plastic"
#   density          g/cm3
#   hydrogen         hydrogen atoms per cm3
#   carbon           carbon atoms per cm3
#   light_output     the proton light-output curve L(E) = a1 E - a2 (1 - exp(-a3 E^a4)), with E the proton energy
#                    in MeV and L in MeVee (the energy an electron would need to give the same light)
#   sources          where the numbers come from
#   typical          the fields that are NOT from the sources: typical values, to be replaced by the numbers of the
#                    detector actually used
#
# [carbon_total] is the neutron total cross section of natural carbon, used only to attenuate the beam of
# neutrons in the cell and in cross-talk (the n-C collisions are taken to give no light).
#
# The n-p cross section is not tabulated here: physim.nuclear.neutrons uses Gammel's closed form.

[materials.EJ-301]
title = "EJ-301 liquid scintillator (the same as NE213 and BC-501A), with pulse-shape discrimination"
kind = "liquid"
density = 0.874
hydrogen = 4.82e22
carbon = 3.98e22
light_output = { a1 = 0.83, a2 = 2.82, a3 = 0.25, a4 = 0.93 }
sources = [
    "Eljen Technology, EJ-301 and EJ-309 product page, https://eljentechnology.com/products/liquid-scintillators/ej-301-ej-309 (read 2026-11-14): specific gravity, H and C atoms per cm3",
    "R. A. Cecil, B. D. Anderson and R. Madey, Nucl. Instrum. Methods 161, 439 (1979): light output of protons in NE213",
]
typical = []

[materials.EJ-309]
title = "EJ-309 liquid scintillator (high flash point), with pulse-shape discrimination"
kind = "liquid"
density = 0.959
hydrogen = 5.43e22
carbon = 4.35e22
light_output = { a1 = 0.83, a2 = 2.82, a3 = 0.25, a4 = 0.93 }
sources = [
    "Eljen Technology, EJ-301 and EJ-309 product page, https://eljentechnology.com/products/liquid-scintillators/ej-301-ej-309 (read 2026-11-14): specific gravity, H and C atoms per cm3",
]
typical = ["light_output"]

[materials.EJ-200]
title = "EJ-200 plastic scintillator (the same as NE102 and BC-408), no pulse-shape discrimination"
kind = "plastic"
density = 1.023
hydrogen = 5.17e22
carbon = 4.69e22
light_output = { a1 = 0.95, a2 = 8.0, a3 = 0.1, a4 = 0.90 }
sources = [
    "Eljen Technology, EJ-200 product page, https://eljentechnology.com/products/plastic-scintillators/ej-200-ej-204-ej-208-ej-212 (read 2026-11-14): density, H and C atoms per cm3",
    "R. A. Cecil, B. D. Anderson and R. Madey, Nucl. Instrum. Methods 161, 439 (1979): light output of protons in NE102",
]
typical = ["light_output"]

[carbon_total]
# Neutron energy in MeV and total cross section of natural carbon in barns, from ENDF/B-VIII.0 (MF=3, MT=1 of
# n-006_C_012 and n-006_C_013, weighted 0.9893 and 0.0107), written by scripts/endf_neutron_reference.py --toml.
# 40 points per decade from 10 keV to 30 MeV; each value is the average of the pointwise cross section over its own
# bin (a factor 1.029 either side of the energy), so resonances narrower than a bin (the 2.08 MeV peak, the 2.82
# MeV dip, the structure from 6 to 9 MeV) are spread over the bin with their area kept. Above 20 MeV, where the
# 13C evaluation stops, 13C takes the 12C values. tests/reference/nuclear/neutron_carbon_endf.csv holds the
# comparison points.
