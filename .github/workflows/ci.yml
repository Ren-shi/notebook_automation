name: CI

# A pull request runs once, on the code as it would be merged; pushes to main and version tags run everything.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a pull request touches the Rust code. Anywhere else the Rust job always runs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.find.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # a pull request is checked out merged into its base, which is the first parent
      - id: find
        run: |
          rust=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            grep -qE '^(src/|benches/|examples/|tests/[^/]+\.rs$|Cargo\.|\.cargo/|[^/]*\.toml$|rust-toolchain|\.github/workflows/ci\.yml$)' <<< "$files" || rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: Tests without the parallel feature
        run: cargo test --release --no-default-features --lib --test physics --test world_api --test force_reuse --test events --test checkpoint --test constraints --test adaptive --test forces --test integrators --test chaos --test em --test tree --test collisions --test md --test rigid --test fields --test quantum --test rng --test nuclear_events

  python:
    name: Python (bindings, notebooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Build extension
        run: |
          source .venv/bin/activate
          maturin develop --release
      # Four at a time, each file on one worker (the files' fixtures are slow to make). The slowest tests and
      # what was skipped, and why, are listed at the end.
      - name: Binding tests
        run: .venv/bin/pytest tests/python -n 4 --dist loadfile --durations=15 -rs
      # Docs executes the notebooks of a pull request; this also looks for errors in their outputs.
      - name: Execute notebooks
        if: github.event_name != 'pull_request'
        run: .venv/bin/python scripts/run_notebooks.py
