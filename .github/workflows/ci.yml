name: CI

# A pull request runs once, on the code as it would be merged, and leaves out the slow tests of what it does not
# change (.github/slow-tests.txt, scripts/ci_shard.py). Pushes to main, version tags and runs started by hand
# (gh workflow run ci.yml --ref BRANCH) run everything.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a pull request touches the Rust code, and the test files it runs whole. Anywhere else everything runs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.find.outputs.rust }}
      shards: ${{ steps.find.outputs.shards }}
      tests: ${{ steps.find.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # a pull request is checked out merged into its base, which is the first parent
      - id: find
        run: |
          rust=true shards='[1, 2, 3, 4, 5, 6, 7, 8]' tests=''
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            shards='[1, 2, 3, 4, 5, 6]'
            tests="--quick --slow-in $(python3 scripts/ci_shard.py --changed <<< "$files")"
            grep -qE '^(src/|benches/|examples/|tests/[^/]+\.rs$|Cargo\.|\.cargo/|[^/]*\.toml$|rust-toolchain|\.github/workflows/ci\.yml$)' <<< "$files" || rust=false
          fi
          { echo "rust=$rust"; echo "shards=$shards"; echo "tests=$tests"; } | tee -a "$GITHUB_OUTPUT"

  rust:
    name: Rust (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: Tests without the parallel feature
        run: cargo test --release --no-default-features --lib --test physics --test world_api --test force_reuse --test events --test checkpoint --test constraints --test adaptive --test forces --test integrators --test chaos --test em --test tree --test collisions --test md --test rigid --test fields --test quantum --test rng --test nuclear_events

  # The test files are shared out over runners (scripts/ci_shard.py): the tests use every core themselves, so
  # running several at once on one runner gains little and slows the ones with time limits.
  python:
    name: Python (${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Build extension
        run: |
          source .venv/bin/activate
          maturin develop --release
      # The slowest tests and what was skipped, and why, are listed at the end.
      - name: Binding tests
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: .venv/bin/pytest $(python scripts/ci_shard.py ${{ matrix.shard }} ${{ strategy.job-total }} $TESTS) --durations=0 --durations-min=2 -rs
      # Docs executes the notebooks of a pull request; this also looks for errors in their outputs.
      - name: Execute notebooks
        if: github.event_name != 'pull_request' && matrix.shard == 8
        run: .venv/bin/python scripts/run_notebooks.py
