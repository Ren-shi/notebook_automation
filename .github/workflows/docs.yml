name: Docs

# Builds the documentation (Sphinx with the example notebooks executed, plus the Rust API from
# cargo doc) on every push and pull request, failing on any warning. Version tags (and manual
# runs) publish it to GitHub Pages.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docs/requirements.txt
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt -r docs/requirements.txt
          source .venv/bin/activate
          maturin develop --release
      - name: Sphinx (warnings are errors)
        run: .venv/bin/sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Rust API reference
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          cp -r target/doc docs/_build/html/rust
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
