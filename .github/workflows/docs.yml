name: Docs

# Builds the documentation (Sphinx, with the example notebooks executed on main if more than text changed and on a pull
# request only if it changes notebooks, plus the Rust API from cargo doc where the Rust code changed) on pushes to main and
# on every pull request that can change it, failing on any warning. Version tags (and manual runs) publish it to GitHub Pages.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - "notebooks/**"
      - "python/**"
      - "src/**"
      - "Cargo.*"
      - "pyproject.toml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# A new push to a pull request replaces its run. Each push to main has its own: whether it runs the notebooks depends on
# what that push changed.
concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # a pull request is merged into its base, the first parent
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt docs/requirements.txt
      - id: what
        env:
          EVENT: ${{ startsWith(github.ref, 'refs/tags/') && 'tag' || github.event_name }}
        run: |
          rust=true notebooks=true
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            git diff --name-only HEAD^1 HEAD > changed
            grep -qE '^(src/|Cargo\.)' changed || rust=false
            grep -q '^notebooks/' changed || notebooks=false
            if [ "$EVENT" = push ] && [ "$(python scripts/ci_tests.py code-changed HEAD^1)" = true ]; then notebooks=true; fi
          fi
          { echo "rust=$rust"; echo "notebooks=$notebooks"; } | tee -a "$GITHUB_OUTPUT"
      - name: Sphinx (warnings are errors)
        run: |
          if [ ${{ steps.what.outputs.notebooks }} = false ]; then export PHYSIM_DOCS_NOTEBOOKS=off; fi
          .venv/bin/sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Rust API reference
        if: steps.what.outputs.rust == 'true'
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          cp -r target/doc docs/_build/html/rust
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
