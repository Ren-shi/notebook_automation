name: Release

# Builds abi3 wheels (one per platform covers Python 3.9+) and a source distribution, installs
# each wheel on a machine without Rust and runs the binding tests, and on a version tag
# (v1.2.3) publishes to PyPI with trusted publishing. Pull requests that touch packaging run
# the build and test jobs only.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-14, target: x86_64 }  # cross-compiled on Apple silicon
          - { os: macos-14, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  sdist-build:
    name: Build and test from the source distribution
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Install from the sdist (compiles the engine)
        run: python -m pip install dist/*.tar.gz pytest matplotlib
      - name: Binding tests
        run: |
          cp -r tests/python "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m pytest tests -q

  test:
    name: Test wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Install the wheel (no Rust toolchain involved)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --no-index --find-links dist physim-engine --no-deps
          python -m pip install numpy pytest matplotlib
      - name: Binding tests against the installed wheel
        shell: bash
        # Run from a directory without the source tree so the installed package is imported.
        run: |
          cp -r tests/python "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -c "import physim, sys; print(physim.__version__, physim.__file__); assert 'site-packages' in physim.__file__"
          python -m pytest tests -q

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, sdist-build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no API token stored in the repository
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crate:
    name: Publish the Rust crate
    # Opt in by setting the repository variable PUBLISH_CRATE=true and the secret CARGO_REGISTRY_TOKEN.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CRATE == 'true'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
